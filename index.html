<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>En 3 temps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Plateau sombre de studio, une carte au centre, les 3 temps comme une régie à onglets */
:root{
  color-scheme: dark;
  --stage:#111318;
  --stage-2:#1A1D24;
  --line:#2A2E38;
  --ink:#ECEDEF;
  --muted:#8C92A0;
  --paper:#F7F6F2;
  --paper-ink:#15171C;
  --t1:#3D7BFF;   /* Business, le présent */
  --t2:#F0484E;   /* Humain, le passé */
  --t3:#F5B800;   /* Vision, le futur */
  --t4:#ECEDEF;   /* Final */
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-variation-settings:"wdth" 100;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;font-size:22px;letter-spacing:.01em;text-transform:uppercase;line-height:1;display:flex;align-items:baseline;gap:6px}
.logo b{display:inline-flex;gap:3px;align-items:center}
.logo i{display:inline-block;width:7px;height:18px;border-radius:2px}
.logo i:nth-child(1){background:var(--t1)}.logo i:nth-child(2){background:var(--t2)}.logo i:nth-child(3){background:var(--t3)}
.reset{font:600 13px var(--body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.reset.armed{color:var(--stage);background:var(--t2);border-color:var(--t2)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{position:relative;background:var(--stage-2);border:1px solid var(--line);border-radius:12px;padding:10px 8px 9px;text-align:left;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;font-family:var(--body)}
.tab .n{font:900 11px var(--display);font-variation-settings:"wdth" 125;letter-spacing:.08em;text-transform:uppercase}
.tab .name{font:700 15px var(--display);font-variation-settings:"wdth" 88;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .left{font-size:11px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.tab[aria-selected="true"] .n{color:var(--c)}
.tab:focus-visible,.btn:focus-visible,.reset:focus-visible,.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.stage{perspective:1400px;flex:1;display:flex;min-height:340px}
.card{position:relative;width:100%;min-height:340px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;padding:0;background:none;color:inherit;font:inherit;text-align:left}
.card.flipped{transform:rotateY(180deg);cursor:default}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:22px;box-sizing:border-box;overflow:hidden}
.back{background:var(--c);color:var(--paper-ink);justify-content:space-between}
.back .big{font:900 clamp(44px,15vw,76px)/.9 var(--display);font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.back .sub{font:700 14px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.back .hint{font:600 15px var(--body);display:flex;align-items:center;gap:8px}
.back .pattern{position:absolute;right:-30px;bottom:-40px;font:900 260px/1 var(--display);font-variation-settings:"wdth" 125;opacity:.13;pointer-events:none}
.front{background:var(--paper);color:var(--paper-ink);transform:rotateY(180deg);gap:14px}
.front .tag{display:flex;align-items:center;justify-content:space-between;gap:10px;font:800 12px var(--display);font-variation-settings:"wdth" 110;letter-spacing:.1em;text-transform:uppercase}
.front .tag span:first-child{display:flex;align-items:center;gap:8px}
.front .tag span:first-child::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.front .tag .k{color:#6B6F7A;font-variant-numeric:tabular-nums}
.front .q{flex:1;display:flex;align-items:center;font:800 clamp(26px,7.4vw,38px)/1.12 var(--display);font-variation-settings:"wdth" 92;text-wrap:balance;min-width:0}
.front .bar{height:6px;border-radius:3px;background:var(--c)}

.empty .q{color:#6B6F7A}

.actions{display:grid;grid-template-columns:1fr auto;gap:10px}
.btn{font:800 17px var(--display);font-variation-settings:"wdth" 110;letter-spacing:.02em;text-transform:uppercase;border-radius:14px;padding:16px 18px;cursor:pointer;border:1px solid var(--line);background:var(--stage-2);color:var(--ink)}
.btn.primary{background:var(--c);border-color:var(--c);color:var(--paper-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.next{font-size:14px;padding-inline:16px}

.log{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.log-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.log h2{margin:0;font:800 13px var(--display);font-variation-settings:"wdth" 110;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.copy{font:600 13px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.log ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:q}
.log li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:14px;line-height:1.4;color:var(--ink)}
.log li::before{content:counter(q);font:800 12px var(--display);color:var(--stage);background:var(--c);border-radius:6px;height:22px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.log .none{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--stage);font:700 14px var(--body);padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (prefers-reduced-motion: reduce){.card{transition:none}.toast{transition:none}}
</style>

<div class="app">
  <header>
    <div class="logo"><b><i></i><i></i><i></i></b>En 3 temps</div>
    <button class="reset" id="reset" type="button">Nouvel épisode</button>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <div class="stage">
    <button class="card" id="card" type="button" aria-live="polite">
      <div class="face back" id="back"></div>
      <div class="face front" id="front"></div>
    </button>
  </div>

  <div class="actions">
    <button class="btn primary" id="draw" type="button">Tirer une carte</button>
    <button class="btn next" id="next" type="button">Temps suivant</button>
  </div>

  <section class="log">
    <div class="log-head">
      <h2>Questions de l'épisode</h2>
      <button class="copy" id="copy" type="button">Copier</button>
    </div>
    <ol id="log"></ol>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DECKS = [
  { id:"business", n:"Temps 1", name:"Business", time:"Le présent", color:"var(--t1)", q:[
    "Explique ce que tu fais comme à un enfant de 10 ans. T'as 30 secondes.",
    "Ton tout premier euro gagné, c'était comment ?",
    "Qu'est-ce que les gens ne savent pas sur ton métier ?",
    "Une journée normale pour toi : ça commence à quelle heure, ça finit à quelle heure ?",
    "La pire galère pro que t'aies vécue ?",
    "Combien de temps avant de vraiment gagner ta vie avec ce que tu fais ?",
    "Si tu repartais de zéro demain, tu referais exactement pareil ?",
    "La plus grosse erreur d'argent que t'aies faite ?",
    "Qu'est-ce qui te rapporte le plus, et qu'est-ce qui te prend le plus de temps ?",
    "Le meilleur conseil business qu'on t'ait donné. Et le pire ?",
    "Ton métier dans 10 ans, il existe encore ? L'IA te fait peur ?",
    "C'est quoi le truc le plus sous-coté dans ton secteur ?",
    "Gagner plus ou travailler moins : tu choisis quoi ?",
    "Qui t'a donné ta première vraie chance ?",
    "La décision pro la plus dure que t'aies prise ?",
    "Ce que ça coûte vraiment de faire ton métier : matériel, formation, charges ?",
    "Qu'est-ce qui t'énerve le plus chez les gens de ton milieu ?",
    "Le jour où t'as eu le plus peur pour ton activité ?",
    "Je te donne 10 000 € pour ton activité. T'en fais quoi ?",
    "Patron, salarié ou indépendant : pourquoi t'as choisi ça ?"
  ]},
  { id:"humain", n:"Temps 2", name:"Humain", time:"Le passé", color:"var(--t2)", q:[
    "Tu voulais faire quoi quand t'étais petit ?",
    "Le moment où t'as failli tout lâcher ?",
    "Qui t'a le plus marqué dans ta vie, et pourquoi ?",
    "L'argent à la maison quand t'étais petit, c'était comment ?",
    "Ce que tes parents pensent de ce que tu fais ?",
    "Ton plus grand échec, et ce qu'il t'a appris ?",
    "Une décision que tu regrettes ?",
    "Le moment où t'as été le plus fier de toi ?",
    "Tu faisais quoi à 18 ans ?",
    "Quelqu'un qui n'a pas cru en toi ?",
    "Qu'est-ce que tu sacrifies pour ce que tu fais ?",
    "Une rencontre qui a tout changé ?",
    "Un défaut que tu assumes complètement ?",
    "Le meilleur jour de ta vie, jusqu'ici ?",
    "Qu'est-ce qui te fait encore douter aujourd'hui ?",
    "Qu'est-ce qui te met en colère dans le monde ?",
    "Tes potes d'enfance, ils te voient comment aujourd'hui ?",
    "L'école, c'était comment pour toi ?",
    "Un truc que presque personne ne sait sur toi ?",
    "Quand ça va pas, tu fais quoi pour remonter ?"
  ]},
  { id:"vision", n:"Temps 3", name:"Vision", time:"Le futur", color:"var(--t3)", q:[
    "Toi dans 10 ans, concrètement : où, avec qui, à faire quoi ?",
    "Je te donne 100 000 € demain. T'en fais quoi ?",
    "C'est quoi, réussir, pour toi ?",
    "Si tu savais que tu ne pouvais pas échouer, tu lancerais quoi ?",
    "Une chose que tu veux avoir accomplie avant 40 ans ?",
    "On doit se souvenir de toi pour quoi ?",
    "Tu te vois faire ta vie ici, ou partir ?",
    "Le prochain gros risque que tu vas prendre ?",
    "Quel métier va exploser dans les 10 prochaines années ?",
    "Quelle personne tu aimerais devenir ?",
    "Combien il faut gagner par mois pour être tranquille, selon toi ?",
    "Si tu pouvais changer une seule chose en France demain ?",
    "Ton rêve le plus fou, celui que tu dis pas trop ?",
    "Qu'est-ce que tu voudrais transmettre ?",
    "Un objectif pour cette année. Annonce-le face caméra, on vérifiera.",
    "1 million aujourd'hui ou 10 millions dans 10 ans ?",
    "Qu'est-ce que tu veux arrêter de faire ?",
    "Qui tu voudrais voir assis à ta place au prochain épisode ?",
    "Le monde dans 20 ans : mieux ou pire qu'aujourd'hui ?",
    "Une phrase pour la personne qui regarde cette vidéo ?"
  ]},
  { id:"final", n:"Fin", name:"Final", time:"La dernière", color:"var(--t4)", fixed:true, q:[
    "Qu'est-ce que tu dirais à toi-même à 15 ans ?"
  ]}
];

const KEY = "en3temps-episode-v1";
let state = { tab:0, used:{business:[],humain:[],vision:[]}, log:[], current:null };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.used) state = Object.assign(state, s); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const $ = id => document.getElementById(id);
const card = $("card"), back = $("back"), front = $("front");

function remaining(d){ return d.fixed ? 1 : d.q.length - (state.used[d.id]||[]).length; }

function renderTabs(){
  $("tabs").innerHTML = DECKS.map((d,i)=>`
    <button class="tab" role="tab" type="button" id="tab-${d.id}" aria-selected="${i===state.tab}" style="--c:${d.color}" data-i="${i}">
      <span class="n">${d.n}</span>
      <span class="name">${d.name}</span>
      <span class="left">${d.fixed ? "1 question" : remaining(d)+" / "+d.q.length}</span>
    </button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ state.tab=+b.dataset.i; state.current=null; save(); render(); });
}

function renderCard(){
  const d = DECKS[state.tab];
  document.querySelector(".app").style.setProperty("--c", d.color);
  card.style.setProperty("--c", d.color);
  back.innerHTML = `
    <div class="sub">${d.n} · ${d.time}</div>
    <div class="big">${d.name}</div>
    <div class="hint">${d.fixed ? "Touche pour révéler" : (remaining(d) ? "Touche pour tirer" : "Plus de cartes dans ce tas")}</div>
    <div class="pattern">${d.fixed ? "★" : state.tab+1}</div>`;
  const cur = state.current && state.current.deck===d.id ? state.current : null;
  if (cur){
    const pos = d.fixed ? "" : `Carte ${state.used[d.id].length} / ${d.q.length}`;
    front.innerHTML = `
      <div class="tag"><span>${d.name} · ${d.time}</span><span class="k">${pos}</span></div>
      <div class="q">${d.q[cur.i]}</div>
      <div class="bar"></div>`;
    card.classList.add("flipped");
  } else {
    card.classList.remove("flipped");
  }
  const left = remaining(d);
  $("draw").textContent = d.fixed ? "Révéler la question finale" : (cur ? "Tirer une autre carte" : "Tirer une carte");
  $("draw").disabled = !d.fixed && left===0;
  if (d.fixed && cur) $("draw").disabled = true;
  $("next").textContent = state.tab < 3 ? "Temps suivant" : "Retour au 1";
}

function renderLog(){
  const ol = $("log");
  if (!state.log.length){ ol.innerHTML = `<li class="none" style="display:block">Rien de tiré pour l'instant. Commence par le Temps 1.</li>`; return; }
  ol.innerHTML = state.log.map(l=>{
    const d = DECKS.find(x=>x.id===l.deck);
    return `<li style="--c:${d.color}"><span><strong>${d.name}</strong> · ${d.q[l.i]}</span></li>`;
  }).join("");
}

function render(){ renderTabs(); renderCard(); renderLog(); }

let wake=null;
async function keepAwake(){ try{ if(!wake && navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); }catch(e){} }

function draw(){
  keepAwake();
  const d = DECKS[state.tab];
  let i;
  if (d.fixed){ i = 0; }
  else {
    const used = state.used[d.id];
    const pool = d.q.map((_,k)=>k).filter(k=>!used.includes(k));
    if (!pool.length) return;
    i = pool[Math.floor(Math.random()*pool.length)];
    used.push(i);
  }
  state.current = { deck:d.id, i };
  if (!state.log.some(l=>l.deck===d.id && l.i===i)) state.log.push({ deck:d.id, i });
  save();
  if (card.classList.contains("flipped")){
    card.classList.remove("flipped");
    setTimeout(()=>{ renderTabs(); renderCard(); renderLog(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 280);
  } else { render(); }
}

card.onclick = ()=>{ if (!card.classList.contains("flipped")) draw(); };
$("draw").onclick = draw;
$("next").onclick = ()=>{ state.tab = (state.tab+1)%4; state.current=null; save(); render(); };

let armT=null;
$("reset").onclick = ()=>{
  const b=$("reset");
  if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Confirmer ?"; armT=setTimeout(()=>{b.classList.remove("armed");b.textContent="Nouvel épisode";},3000); return; }
  clearTimeout(armT); b.classList.remove("armed"); b.textContent="Nouvel épisode";
  state = { tab:0, used:{business:[],humain:[],vision:[]}, log:[], current:null }; save(); render(); toast("Nouvel épisode prêt");
};

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1600); }
$("copy").onclick = ()=>{
  const txt = state.log.map((l,k)=>{ const d=DECKS.find(x=>x.id===l.deck); return `${k+1}. [${d.name}] ${d.q[l.i]}`; }).join("\n") || "Aucune question tirée";
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("Liste copiée")).catch(()=>toast("Copie impossible ici"));
  } else toast("Copie impossible ici");
};

render();
</script>

</body></html>
